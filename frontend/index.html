<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
        name="theme-color"
        content="#0f1115"
    >

    <title>TriageBot</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">

        <!-- Mobile / top header -->
        <header class="topbar">
            <button
                class="icon-button"
                id="menuButton"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="brand">
                <span class="brand-name">TriageBot</span>
                <span class="status">
                    <span class="status-dot"></span>
                    Online
                </span>
            </div>

            <button
                class="icon-button"
                id="newChatButton"
                type="button"
                aria-label="New chat"
            >
                +
            </button>
        </header>


        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">
                <span>TriageBot</span>

                <button
                    class="icon-button sidebar-close"
                    id="closeSidebarButton"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>
            </div>

            <button
                class="new-chat-button"
                id="sidebarNewChatButton"
                type="button"
            >
                <span>+</span>
                New Chat
            </button>

            <div class="sidebar-section">
                <div class="sidebar-label">
                    Recent
                </div>

                <button class="conversation">
                    Windows Wi-Fi troubleshooting
                </button>

                <button class="conversation">
                    PowerShell issue
                </button>

                <button class="conversation">
                    Tailscale connection
                </button>
            </div>

            <div class="sidebar-footer">
                <span class="private-label">
                    Private
                </span>

                <span class="private-description">
                    Your IT knowledge base
                </span>
            </div>
        </aside>


        <!-- Overlay for mobile sidebar -->
        <div
            class="sidebar-overlay"
            id="sidebarOverlay"
        ></div>


        <!-- Main chat -->
        <main class="chat">

            <section
                class="messages"
                id="messages"
            ></section>


            <!-- Message composer -->
            <div class="composer-area">

                <form
                    class="composer"
                    id="chatForm"
                >

                    <textarea
                        id="messageInput"
                        name="message"
                        rows="1"
                        placeholder="Describe your IT problem..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        class="send-button"
                        id="sendButton"
                        type="submit"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </form>

                <div class="composer-note">
                    Security issues reach a human immediately. Every conversation gets a documented ticket.
                </div>

            </div>

        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
